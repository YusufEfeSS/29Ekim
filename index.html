const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W,H,dpr,particles=[],raf=0,started=0,img=new Image();
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(img.complete&&img.naturalWidth)build()}
function build(){let off=document.createElement('canvas'),oc=off.getContext('2d');let scale=Math.min(W*.9/img.width,H*.82/img.height);let iw=Math.floor(img.width*scale),ih=Math.floor(img.height*scale);off.width=iw;off.height=ih;oc.drawImage(img,0,0,iw,ih);let d=oc.getImageData(0,0,iw,ih).data,step=Math.max(3,Math.floor(W/145));particles=[];let ox=(W-iw)/2,oy=(H-ih)/2-12;for(let y=1;y<ih;y+=step)for(let x=1;x<iw;x+=step){let i=(y*iw+x)*4,lum=d[i]*.299+d[i+1]*.587+d[i+2]*.114;if(lum>32)particles.push({tx:ox+x,ty:oy+y,x:Math.random()*W,y:Math.random()*H,delay:Math.random()*.55,lum,b:lum/255})}started=performance.now();if(raf)cancelAnimationFrame(raf);animate()}
function animate(now=performance.now()){ctx.fillStyle='#030304';ctx.fillRect(0,0,W,H);let elapsed=(now-started)/1000;let g=ctx.createRadialGradient(W/2,H*.43,4,W/2,H*.43,Math.max(W,H)*.65);g.addColorStop(0,'rgba(125,0,20,.18)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const p of particles){let t=Math.max(0,Math.min(1,(elapsed-p.delay*.8)/2.9)),e=1-Math.pow(1-t,3),x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e;ctx.globalAlpha=t<1?.15+e*.85:.68+p.b*.32;ctx.font=`bold ${Math.max(4,Math.min(8,W/100))}px Arial`;ctx.fillStyle=p.lum>175?'#fff0ed':p.lum>95?'#ed3349':'#750b1d';let s=p.lum>170?'CUMHURİYET':p.lum>100?'ATATÜRK':'29 EKİM';ctx.fillText(s[Math.floor((p.tx+p.ty)%s.length)],x,y)}ctx.globalAlpha=1;for(let i=0;i<28;i++){let x=(i*97+now*.012)%W,y=(i*173+now*.02)%H;ctx.fillStyle='rgba(235,20,50,.42)';ctx.fillRect(x,y,1.2,1.2)}raf=requestAnimationFrame(animate)}
img.onload=()=>{size();document.getElementById('status').textContent='';};img.src=PHOTO;
const music=document.getElementById('music'),start=document.getElementById('start');document.getElementById('begin').addEventListener('click',async()=>{start.classList.add('hide');try{await music.play();document.getElementById('sound').textContent='♫ SESİ KAPAT'}catch(e){document.getElementById('sound').hidden=false;document.getElementById('status').textContent='Müzik için ses düğmesine dokun';}});document.getElementById('sound').addEventListener('click',async()=>{if(music.paused){try{await music.play();document.getElementById('sound').textContent='♫ SESİ KAPAT'}catch(e){}}else{music.pause();document.getElementById('sound').textContent='♫ SESİ AÇ'}});addEventListener('resize',size);
</script></body></html>
